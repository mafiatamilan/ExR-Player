[package]
name = "exr-macro"
version = "0.1.0"
edition = "2021"
description = "Macro recorder, editor, JSON import/export, and non-blocking playback scheduler"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
exr-input = { path = "../exr-input" }
exr-android-bridge = { path = "../exr-android-bridge" }
